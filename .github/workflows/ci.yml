# Path-aware CI gates for eshu-scanner-worker (epic eshu-hq/eshu-scanner-worker#1).
#
# Thin caller (issue #11): a `changes` job classifies paths, a `lanes` job
# runs the lane bodies inside the pinned eshu-hq/.github reusable
# (go-collector-ci.yml at an exact commit SHA, never a tag), and
# `ci-complete` aggregates. `ci-complete` is the ONLY context the `main`
# ruleset requires; it fails if a needed lane failed and succeeds when lanes
# were legitimately skipped (docs-only PRs). The effective lane set inside
# `lanes` is lint, test, race, shell, image, govulncheck, gosec, actionlint.
# Each run-* gate below is the exact expression the retired inline lane used.
#
# Two hard rules (epic #1): no static gates, and no hidden debt (lint runs
# on the whole repo, no baseline files). The 500-line cap on .go files is
# enforced by the reusable lint lane.
#
# Accepted deltas of the move (same as eshu-collector-prometheus-mimir #15):
# - gosec SARIF no longer uploads to the Security tab (the reusable runs on
#   a read-only token for fork safety); findings ride the run artifact, and
#   scheduled findings fail the lane loud.
# - Scheduled govulncheck/gosec no longer open or update a tracking issue
#   (no reusable hook yet); triage rides the run page.
# - There is no boundary lane: no boundary-command is set, so the reusable
#   skips it.
# - Tool pins follow the reusable's org pins: govulncheck v1.9.0, gosec
#   v2.30.0 (this repo previously floated), actionlint 1.7.12 (was 1.7.7).
# - Inner lane names now appear as `lanes / <lane>`; only ci-complete is
#   required, so no required context changes.
#
# Fork safety: PR lanes use contents: read, need no secrets, pin every action
# by SHA, and cancel superseded runs per PR.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC: govulncheck + gosec only.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      go_module: ${{ steps.filter.outputs.go_module }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # dorny/paths-filter@v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
            go_module:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            # No `!` exclusions: paths-filter ORs separately-compiled
            # patterns, so a bare negation matches every file it does not
            # exclude (issue #15). `.github/dependabot.yml` classifies as
            # fixtures and runs `test` only, which no-ops without Go code.
            fixtures:
              - 'testdata/**'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.example.*'
            shell:
              - '**/*.sh'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
            workflows:
              - '.github/workflows/**'

  lanes:
    name: lanes
    needs: [changes]
    # No timeout-minutes: the schema forbids it on reusable-call jobs. Each
    # inner lane carries its own timeout, which bounds this job.
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: scanner-worker
      go-version-file: go.mod
      # Child issue #5. First measured baseline: 67.4% at the analyzer-lanes
      # + OS parser landing (PR #20). The floor sits at the highest measured
      # baseline and may only rise; the epic does not close below 90.
      # Pinned equal to the Makefile by TestCoverageFloorParity.
      coverage-floor: 67.4
      golangci-lint-version: v2.12.2
      govulncheck-version: v1.9.0
      gosec-version: v2.30.0
      actionlint-version: 1.7.12
      actionlint-sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run-lint: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.go_module == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-test: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.go_module == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-race: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.go_module == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-shell: ${{ ((github.event_name == 'pull_request' || github.event_name == 'push') && needs.changes.outputs.shell == 'true') }}
      run-image: ${{ ((github.event_name == 'pull_request' || github.event_name == 'push') && needs.changes.outputs.docker == 'true') }}
      image-tag: eshu-scanner-worker:ci
      image-context: .
      run-govulncheck: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && (needs.changes.outputs.go_module == 'true')) }}
      run-gosec: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.go_module == 'true')) }}
      gosec-fail-on-findings: ${{ github.event_name == 'schedule' }}
      run-actionlint: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && needs.changes.outputs.workflows == 'true') }}

  ci-complete:
    needs: [changes, lanes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: aggregate (pass when needed lanes passed or legitimately skipped)
        run: |
          python3 - <<'EOF'
          import json, os
          # NEEDS_JSON is toJSON(needs): {job: {"result": ..., "outputs": ...}}.
          # Compare v["result"]: comparing whole job objects never matches
          # (false-green), and needs.*.result is a bare ARRAY that kills
          # green runs. Proven by the seeded red/green lane proofs in the
          # closing PR; never change this shape without re-seeding.
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if isinstance(v, dict) and v.get("result") in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              raise SystemExit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
